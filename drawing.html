<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draw Your Lamp Shade — Lamp Shade Studio</title>
<style>
  :root {
    --bg: #29242a;
    --glass: rgba(239, 239, 239, 0.05);
    --glass-border: rgba(255, 255, 255, 0.3);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 40px 24px;
    text-align: center;
  }

  h1 {
    font-weight: 500;
    font-size: 28px;
    margin: 0;
  }

  p {
    max-width: 420px;
    font-size: 16px;
    color: rgba(255, 255, 255, 0.7);
    margin: 0;
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 40px;
    background: var(--glass);
    border: 0.3px solid var(--glass-border);
    border-radius: 77px;
    color: #fff;
    font-size: 16px;
    text-decoration: none;
    transition: background 0.2s ease;
  }

  .back:hover {
    background: rgba(239, 239, 239, 0.1);
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Drawing screen — coming soon</h1>
    <p>This is where you'll sketch directly on the lamp shade's left or right panel. Leave it blank and it stays plain and lit.</p>
    <a class="back" href="index.html">&larr; Back to lamp</a>
  </div>
</body>
</html>
