<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draw Your Lamp Shade — Lamp Shade Studio</title>
<style>
  :root {
    --bg: #29242a;
    --glass: rgba(239, 239, 239, 0.05);
    --glass-border: rgba(255, 255, 255, 0.3);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  /* The whole composition is authored at a fixed 1440x1024 design
     size (matching the Figma desktop frame) and scaled as one unit
     to fit the viewport -- responsive via scale, not reflow. */
  .viewport {
    width: 100%;
    height: 100%;
    min-height: 100vh;
    overflow: auto;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  .scale-outer {
    position: relative;
    flex-shrink: 0;
  }

  .scale-wrap {
    position: absolute;
    top: 0;
    left: 0;
    width: 1440px;
    height: 1024px;
    transform-origin: top left;
  }

  .done-btn {
    position: absolute;
    left: 1059px;
    top: 41px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px 40px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(8px) saturate(160%);
    -webkit-backdrop-filter: blur(8px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), inset 0 0 0 0.3px rgba(255, 255, 255, 0.2);
    border: none;
    border-radius: 77px;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s ease;
  }

  .done-btn:hover {
    background: rgba(255, 255, 255, 0.22);
  }

  .done-btn img {
    display: block;
    width: 13px;
    height: 13px;
  }

  .panel-label {
    position: absolute;
    margin: 0;
    font-size: 20px;
    font-style: italic;
    padding-bottom: 8px;
    border-bottom: 1px solid #fff;
  }

  .panel-label.left { left: 122px; top: 176px; }
  .panel-label.right { left: 829px; top: 176px; }

  .canvas-frame {
    position: absolute;
    top: 244px;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(8px) saturate(160%);
    -webkit-backdrop-filter: blur(8px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    padding: 23px;
    border-radius: 6px;
  }

  .canvas-frame.left { left: 122px; }
  .canvas-frame.right { left: 829px; }

  .draw-canvas {
    display: block;
    width: 442px;
    height: 464px;
    background: #fff6e8;
    border-radius: 3px;
    cursor: crosshair;
    touch-action: none;
  }

  /* ---------- Bottom toolbar ----------
     Positioned by JS to track the scaled canvas (its left/top origin
     scales), but the toolbar's own size and every child inside it
     stay fixed -- swatches stay a tappable 32px and nothing here
     shrinks or overflows the pill at small scales. */
  .toolbar {
    position: absolute;
    height: 102px;
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 0 24px;
    background: rgba(239, 239, 239, 0.5);
    border: 1px solid #fff;
    border-radius: 1000px;
    white-space: nowrap;
  }

  .toolbar-divider {
    align-self: stretch;
    width: 1px;
    margin: 14px 0;
    background: #fff;
  }

  .tool-btn {
    height: 90px;
    width: auto;
    padding: 0;
    background: none;
    border: none;
    cursor: pointer;
    opacity: 0.65;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .tool-btn img {
    display: block;
    height: 100%;
    width: auto;
  }

  .tool-btn.active {
    opacity: 1;
    transform: scale(1.08);
  }

  .brush-group {
    display: flex;
    align-items: center;
    gap: 20px;
    border: 0.8px solid #e8e8e8;
    border-radius: 6.4px;
    padding: 8px 20px;
  }

  .brush-btn {
    width: 40px;
    height: 40px;
    padding: 0;
    background: none;
    border: none;
    cursor: pointer;
  }

  .brush-btn img {
    display: block;
    width: 100%;
    height: 100%;
  }

  .color-grid {
    display: grid;
    grid-template-columns: repeat(3, 32px);
    gap: 8px 24px;
  }

  .color-swatch {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    border: 2px solid transparent;
    box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }

  .color-swatch.active {
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #fff;
    transform: scale(1.05);
  }
</style>
</head>
<body>
  <div class="viewport">
    <div class="scale-outer" id="scaleOuter">
      <div class="scale-wrap" id="scaleWrap">
        <button class="done-btn" id="doneBtn" type="button">
          Done - Let’s Turn on the lights
          <img src="assets/create-arrow.svg" alt="">
        </button>

        <p class="panel-label left">Left Panel</p>
        <div class="canvas-frame left">
          <canvas class="draw-canvas" id="leftCanvas" width="524" height="550"></canvas>
        </div>

        <p class="panel-label right">Right Panel</p>
        <div class="canvas-frame right">
          <canvas class="draw-canvas" id="rightCanvas" width="524" height="550"></canvas>
        </div>

      </div>

      <div class="toolbar" id="toolbar">
        <div class="brush-group">
          <button class="brush-btn" id="brushSmall" type="button" aria-label="Small brush">
            <img src="assets/brush-small.svg" alt="">
          </button>
          <button class="brush-btn" id="brushMedium" type="button" aria-label="Medium brush">
            <img src="assets/brush-medium.svg" alt="">
          </button>
          <button class="brush-btn" id="brushLarge" type="button" aria-label="Large brush">
            <img src="assets/brush-large.svg" alt="">
          </button>
        </div>

        <div class="toolbar-divider"></div>

        <button class="tool-btn pencil" id="toolPencil" type="button" aria-label="Pencil">
          <img src="assets/tool-pencil.svg" alt="">
        </button>
        <button class="tool-btn eraser" id="toolEraser" type="button" aria-label="Eraser">
          <img src="assets/tool-eraser.svg" alt="">
        </button>

        <div class="toolbar-divider"></div>

        <div class="color-grid">
          <button class="color-swatch" style="background:#ff0000" data-color="#ff0000" aria-label="Red"></button>
          <button class="color-swatch" style="background:#ff9500" data-color="#ff9500" aria-label="Orange"></button>
          <button class="color-swatch" style="background:#fff600" data-color="#fff600" aria-label="Yellow"></button>
          <button class="color-swatch" style="background:#018003" data-color="#018003" aria-label="Green"></button>
          <button class="color-swatch" style="background:#005cdd" data-color="#005cdd" aria-label="Blue"></button>
          <button class="color-swatch" style="background:#9600ae" data-color="#9600ae" aria-label="Purple"></button>
        </div>
      </div>
    </div>
  </div>

<script>
  // ---- Scale the whole fixed-size composition to fit the viewport ----
  const DESIGN_W = 1440;
  const DESIGN_H = 1024;
  const MIN_SCALE = 0.35;
  const scaleOuter = document.getElementById('scaleOuter');
  const scaleWrap = document.getElementById('scaleWrap');
  const toolbar = document.getElementById('toolbar');

  // Design-space origin of the toolbar (matches its old left/top inside
  // the 1440x1024 frame) -- its position tracks the scale, but the
  // toolbar's own size and everything inside it stay fixed, so nothing
  // shrinks below a tappable size or overflows the pill.
  const TOOLBAR_X = 393;
  const TOOLBAR_Y = 873;

  function applyScale() {
    const factor = Math.max(
      Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H),
      MIN_SCALE
    );
    scaleWrap.style.transform = `scale(${factor})`;
    scaleOuter.style.width = (DESIGN_W * factor) + 'px';
    scaleOuter.style.height = (DESIGN_H * factor) + 'px';
    toolbar.style.left = (TOOLBAR_X * factor) + 'px';
    toolbar.style.top = (TOOLBAR_Y * factor) + 'px';
  }

  applyScale();
  window.addEventListener('resize', applyScale);

  const canvases = {
    left: document.getElementById('leftCanvas'),
    right: document.getElementById('rightCanvas'),
  };
  const ctxs = {
    left: canvases.left.getContext('2d'),
    right: canvases.right.getContext('2d'),
  };
  const drawnFlags = { left: false, right: false };

  const brushSizes = { small: 4, medium: 9, large: 16 };
  let tool = 'pencil';
  let color = '#ff0000';
  let brushSize = brushSizes.medium;

  function getPos(canvas, evt) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const point = evt.touches ? evt.touches[0] : evt;
    return {
      x: (point.clientX - rect.left) * scaleX,
      y: (point.clientY - rect.top) * scaleY,
    };
  }

  // ---- Pencil crayon ------------------------------------------------
  // An irregular paper "tooth" map (one value per canvas pixel) gives the
  // strokes their grain. Wax pigment only catches the raised tooth: the
  // stroke centre presses hard enough to fill most of it, its edge only
  // grazes the peaks, and the hollows stay bare -- so strokes break up into
  // grain instead of pooling. Coverage is tracked per stroke, so a stroke
  // never darkens by overlapping itself. The drawing surface itself stays
  // plain; the tooth only shows through the pigment.
  const CRAYON = {
    tooth: 2.6,      // size of the paper grain in canvas px (bigger = coarser)
    pressure: 0.9,   // how far into the tooth the stroke centre reaches (1+ fills it)
    bite: 2.4,       // grain contrast: higher = crisper, more speckled
    opacity: 0.92,   // pigment strength of a single pass
  };

  function makeTooth(w, h) {
    // Two octaves of smoothed random noise plus per-pixel speckle --
    // the uneven tooth of drawing paper, with no repeating pattern.
    const octave = (cell) => {
      const gw = Math.ceil(w / cell) + 2, gh = Math.ceil(h / cell) + 2;
      const grid = new Float32Array(gw * gh).map(() => Math.random());
      const out = new Float32Array(w * h);
      for (let y = 0; y < h; y++) {
        const gy = y / cell, iy = Math.floor(gy), fy = gy - iy, sy = fy * fy * (3 - 2 * fy);
        for (let x = 0; x < w; x++) {
          const gx = x / cell, ix = Math.floor(gx), fx = gx - ix, sx = fx * fx * (3 - 2 * fx);
          const i = iy * gw + ix;
          const top = grid[i] + (grid[i + 1] - grid[i]) * sx;
          const bot = grid[i + gw] + (grid[i + gw + 1] - grid[i + gw]) * sx;
          out[y * w + x] = top + (bot - top) * sy;
        }
      }
      return out;
    };
    const fine = octave(CRAYON.tooth);
    const coarse = octave(CRAYON.tooth * 4);
    const tooth = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) {
      const t = fine[i] * 0.6 + coarse[i] * 0.25 + Math.random() * 0.25;
      tooth[i] = Math.min(1, Math.max(0, (t - 0.1) * 1.15));
    }
    return tooth;
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function setupCanvas(key) {
    const canvas = canvases[key];
    const ctx = ctxs[key];
    const W = canvas.width, H = canvas.height;
    const tooth = makeTooth(W, H);
    const coverage = new Float32Array(W * H);
    let base = null;   // canvas pixels as they were when this stroke began
    let drawing = false;
    let last = null;

    function crayonSegment(a, b) {
      const r = brushSize * 0.62;
      const x0 = Math.max(0, Math.floor(Math.min(a.x, b.x) - r - 1));
      const y0 = Math.max(0, Math.floor(Math.min(a.y, b.y) - r - 1));
      const x1 = Math.min(W, Math.ceil(Math.max(a.x, b.x) + r + 1));
      const y1 = Math.min(H, Math.ceil(Math.max(a.y, b.y) + r + 1));
      const bw = x1 - x0, bh = y1 - y0;
      if (bw <= 0 || bh <= 0) return;
      const [cr, cg, cb] = hexToRgb(color);
      const sr = cr / 255, sg = cg / 255, sb = cb / 255;
      const dx = b.x - a.x, dy = b.y - a.y;
      const len2 = dx * dx + dy * dy || 1;
      const soft = r * 0.6;
      const out = ctx.createImageData(bw, bh);
      const od = out.data, bd = base.data;
      for (let y = y0; y < y1; y++) {
        for (let x = x0; x < x1; x++) {
          const i = y * W + x;
          const o = ((y - y0) * bw + (x - x0)) * 4;
          const bi = i * 4;
          // distance from this pixel to the segment -> pressure falloff
          const t = Math.max(0, Math.min(1, ((x + 0.5 - a.x) * dx + (y + 0.5 - a.y) * dy) / len2));
          const px = a.x + dx * t - (x + 0.5), py = a.y + dy * t - (y + 0.5);
          const m = Math.max(0, Math.min(1, (r - Math.sqrt(px * px + py * py)) / soft));
          if (m > coverage[i]) coverage[i] = m;
          const cov = coverage[i];
          const ab = bd[bi + 3] / 255;
          if (cov === 0) {
            od[o] = bd[bi]; od[o + 1] = bd[bi + 1]; od[o + 2] = bd[bi + 2]; od[o + 3] = bd[bi + 3];
            continue;
          }
          const dep = Math.max(0, Math.min(1, (tooth[i] + cov * CRAYON.pressure - 1) * CRAYON.bite));
          const as = dep * CRAYON.opacity;
          // layer like real pencil crayons: over existing colour the new
          // pigment multiplies; over bare canvas it's the plain colour
          const rb = bd[bi] / 255, gb = bd[bi + 1] / 255, bbb = bd[bi + 2] / 255;
          const csr = (1 - ab) * sr + ab * sr * rb;
          const csg = (1 - ab) * sg + ab * sg * gb;
          const csb = (1 - ab) * sb + ab * sb * bbb;
          const ao = as + ab * (1 - as);
          if (ao <= 0) { od[o + 3] = 0; continue; }
          od[o] = 255 * (as * csr + ab * rb * (1 - as)) / ao;
          od[o + 1] = 255 * (as * csg + ab * gb * (1 - as)) / ao;
          od[o + 2] = 255 * (as * csb + ab * bbb * (1 - as)) / ao;
          od[o + 3] = 255 * ao;
        }
      }
      ctx.putImageData(out, x0, y0);
    }

    function start(e) {
      e.preventDefault();
      drawing = true;
      last = getPos(canvas, e);
      if (tool !== 'eraser') {
        base = ctx.getImageData(0, 0, W, H);
        coverage.fill(0);
        crayonSegment(last, last);
        drawnFlags[key] = true;
      }
    }
    function move(e) {
      if (!drawing) return;
      e.preventDefault();
      const pos = getPos(canvas, e);

      if (tool === 'eraser') {
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.globalCompositeOperation = 'destination-out';
        ctx.strokeStyle = 'rgba(0,0,0,1)';
        ctx.lineWidth = brushSize;
        ctx.beginPath();
        ctx.moveTo(last.x, last.y);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
      } else {
        crayonSegment(last, pos);
      }
      last = pos;
      drawnFlags[key] = true;
    }
    function end() { drawing = false; last = null; base = null; }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
  }

  setupCanvas('left');
  setupCanvas('right');

  const toolPencil = document.getElementById('toolPencil');
  const toolEraser = document.getElementById('toolEraser');
  function setTool(t) {
    tool = t;
    toolPencil.classList.toggle('active', t === 'pencil');
    toolEraser.classList.toggle('active', t === 'eraser');
  }
  toolPencil.addEventListener('click', () => setTool('pencil'));
  toolEraser.addEventListener('click', () => setTool('eraser'));
  setTool('pencil');

  const brushButtons = {
    small: document.getElementById('brushSmall'),
    medium: document.getElementById('brushMedium'),
    large: document.getElementById('brushLarge'),
  };
  const brushArt = {
    small: { default: 'assets/brush-small.svg', selected: 'assets/brush-small-selected.svg' },
    medium: { default: 'assets/brush-medium.svg', selected: 'assets/brush-medium-selected.svg' },
    large: { default: 'assets/brush-large.svg', selected: 'assets/brush-large-selected.svg' },
  };
  function setBrush(size) {
    brushSize = brushSizes[size];
    Object.entries(brushButtons).forEach(([key, btn]) => {
      const isSelected = key === size;
      btn.classList.toggle('active', isSelected);
      btn.querySelector('img').src = isSelected ? brushArt[key].selected : brushArt[key].default;
    });
  }
  brushButtons.small.addEventListener('click', () => setBrush('small'));
  brushButtons.medium.addEventListener('click', () => setBrush('medium'));
  brushButtons.large.addEventListener('click', () => setBrush('large'));
  setBrush('medium');

  const swatches = document.querySelectorAll('.color-swatch');
  swatches.forEach((sw) => {
    sw.addEventListener('click', () => {
      color = sw.dataset.color;
      swatches.forEach((s) => s.classList.remove('active'));
      sw.classList.add('active');
      setTool('pencil');
    });
  });
  swatches[0].classList.add('active');

  document.getElementById('doneBtn').addEventListener('click', () => {
    ['left', 'right'].forEach((key) => {
      const storageKey = 'lamp' + key.charAt(0).toUpperCase() + key.slice(1) + 'Art';
      if (drawnFlags[key]) {
        localStorage.setItem(storageKey, canvases[key].toDataURL('image/png'));
      } else {
        localStorage.removeItem(storageKey);
      }
    });
    localStorage.setItem('lampCustomized', '1');
    window.location.href = 'index.html?lit=1';
  });
</script>
</body>
</html>
